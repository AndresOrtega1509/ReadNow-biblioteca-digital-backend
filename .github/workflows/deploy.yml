name: CI/CD Backend ReadNow

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Verificar y validar secret Firebase
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_JSON" ]; then
            echo "::error::Agrega el secret FIREBASE_SERVICE_ACCOUNT_JSON en GitHub."
            exit 1
          fi
          printf '%s\n' "$FIREBASE_JSON" > /tmp/firebase-check.json
          python3 -c "import json; json.load(open('/tmp/firebase-check.json'))"
          B64=$(base64 -w0 /tmp/firebase-check.json)
          echo "FIREBASE_B64=$B64" >> "$GITHUB_ENV"
          echo "Firebase JSON valido ($(wc -c < /tmp/firebase-check.json) bytes)"

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Dar permisos a mvnw
        run: chmod +x mvnw

      - name: Compilar con Maven
        run: ./mvnw clean package -DskipTests

      - name: Copiar JAR al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 120s
          source: "target/*.jar"
          target: "/home/${{ secrets.SSH_USER }}/ReadNow-biblioteca-digital-backend"

      - name: Desplegar en servidor
        uses: appleboy/ssh-action@v1.0.3
        env:
          FIREBASE_B64: ${{ env.FIREBASE_B64 }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 120s
          envs: FIREBASE_B64
          script: |
            set -e
            DEPLOY_DIR="$HOME/ReadNow-biblioteca-digital-backend"
            cd "$DEPLOY_DIR"
            echo "$FIREBASE_B64" | base64 -d > firebase-service-account.json
            chmod 600 firebase-service-account.json
            if [ ! -f firebase-service-account.json ] || [ ! -s firebase-service-account.json ]; then
              echo "ERROR: no se pudo crear firebase-service-account.json"
              exit 1
            fi
            if [ ! -d target ] || [ -z "$(ls -A target/*.jar 2>/dev/null)" ]; then
              echo "ERROR: falta el JAR en target/"
              ls -la target/ 2>/dev/null || echo "sin carpeta target"
              exit 1
            fi
            docker network inspect readnow-network >/dev/null 2>&1 || docker network create readnow-network
            docker build --no-cache -t readnow-backend .
            docker rm -f backend-readnow || true
            docker run -d \
              --name backend-readnow \
              --network readnow-network \
              -p 8080:8080 \
              -v "$DEPLOY_DIR/application.properties:/config/application.properties:ro" \
              -v "$DEPLOY_DIR/firebase-service-account.json:/config/firebase-service-account.json:ro" \
              -e SPRING_CONFIG_ADDITIONAL_LOCATION=optional:file:/config/application.properties \
              --restart always \
              readnow-backend
            echo "Deploy OK"
