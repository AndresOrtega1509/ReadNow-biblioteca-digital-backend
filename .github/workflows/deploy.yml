name: CI/CD Backend ReadNow

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Dar permisos a mvnw
        run: chmod +x mvnw

      - name: Compilar con Maven
        run: ./mvnw clean package -DskipTests

      - name: Copiar .jar al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "target/*.jar"
          target: "/home/${{ secrets.SSH_USER }}/ReadNow-biblioteca-digital-backend"

      - name: Desplegar en servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/ReadNow-biblioteca-digital-backend
            docker build --no-cache -t readnow-backend .
            docker rm -f backend-readnow || true
            docker run -d \
              --name backend-readnow \
              --network readnow-network \
              -p 8080:8080 \
              -v /home/scontre001/ReadNow-biblioteca-digital-backend/application.properties:/config/application.properties \
              --restart always \
              readnow-backend