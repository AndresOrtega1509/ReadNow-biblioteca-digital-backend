spring.application.name=app-readNow
# ===============================
# CONFIGURACION DE LA BASE DE DATOS
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3307/read_now_db
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# ===============================
# CONFIGURACION JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===============================
# JWT
# ===============================
jwt.secret=MiClaveSecretaSuperSeguraParaJWT_ReadNow2026!@#$%^&*()_+1234567890abcdef
jwt.expiration=86400000

# ===============================
# VERIFICACION EN DOS PASOS (2FA)
# true = requiere código por correo al iniciar sesión
# false = desarrollo: login devuelve token directo sin pedir código
# ===============================
app.auth.two-factor-enabled=true

# ===============================
# GMAIL SMTP
# ===============================
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=steven4451212@gmail.com
spring.mail.password=zxoynjyzqvaiwyah

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.from=steven4451212@gmail.com

# ===============================
# FIREBASE STORAGE
# ===============================
firebase.credentials.path=firebase-service-account.json
firebase.storage.bucket=readnow-86631.firebasestorage.app

# ===============================
# CONFIGURACION DE SESION
# ===============================
app.session.inactivity-reading-ms=600000
app.session.inactivity-catalog-ms=120000
app.session.countdown-ms=60000

# ===============================
# PRUEBA GRATUITA
# ===============================
app.trial.days=15

# ===============================
# NOTIFICACION DE INACTIVIDAD
# ===============================
app.inactivity.notification-days=1

# ===============================
# RECUPERACIÓN DE CONTRASEÑA (correo + últimos 4 dígitos del teléfono)
# Tras verificar los 4 dígitos se envía un enlace por correo (válido 15 min).
# ===============================
app.recuperacion.minutos=15
# URL base del frontend para el enlace de restablecer contraseña.
# Desarrollo: localhost. Producción: usar application-prod.properties o variable de entorno APP_FRONTEND_URL
app.frontend.url=http://localhost:4200

# ===============================
# CONFIGURACION DE ARCHIVOS
# ===============================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
